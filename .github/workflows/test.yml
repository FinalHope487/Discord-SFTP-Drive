name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Python 3.12 exactly. `pytest.ini` turns DeprecationWarning from `src.*`
    # into an error, and that is the thing that drifts between minor versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/app/package-lock.json
            client/shell/package-lock.json

      # The browser tests refuse to run against a stale bundle rather than
      # building one themselves, so the build happens here, before pytest.
      - name: Build the file manager
        working-directory: client/app
        run: |
          npm ci
          npm run build

      # Electron, for `test_ui_shell.py`. It drives the shell's own two pages
      # in a real window over CDP, so the runner needs the binary itself --
      # not a package this suite imports.
      - name: Install the desktop shell's dependencies
        working-directory: client/shell
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Electron needs a display, and `local.html` needs the backend it
      # spawns. Without the executable those three tests skip themselves and
      # say so; building it here is also the only place CI checks that
      # `discord-drive.spec` still packages at all.
      - name: Install xvfb
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Build the standalone backend
        run: |
          python -m PyInstaller discord-drive.spec --noconfirm \
            --distpath dist-standalone --workpath build-standalone

      - name: pyflakes
        run: python -m pyflakes src tests

      # No credentials and no network: MongoDB and the Discord API are faked.
      # `xvfb-run -a` picks its own display number so two jobs on one runner
      # cannot collide.
      #
      # No `-q` here. `pytest.ini` already sets it, and a second one makes
      # `-qq`, which drops the "N passed" line -- so every green run in this
      # job's history proved only that nothing failed, never that anything
      # ran. Skipped tests and collection that quietly stopped finding files
      # both look exactly like success without that number.
      - name: pytest
        run: xvfb-run -a python -m pytest

      # The same suite against a real SQLite backend. Not a second set of
      # tests -- the assertions written for MongoDB's behaviour, pointed at
      # the other backend, which is how two bugs were found that the default
      # run could not see.
      - name: pytest --db=sqlite
        run: xvfb-run -a python -m pytest --db=sqlite

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/shell/package-lock.json

      - name: Install dependencies
        working-directory: client/shell
        run: npm ci

      # The block that drives the real `discord-drive.exe` skips itself when
      # the executable is absent, which it is here -- PyInstaller only builds
      # for the platform it runs on, and that check belongs on Windows.
      - name: node --test
        working-directory: client/shell
        run: node --test
