[pytest]
testpaths = tests

# The suite imports `src.*` and `tests.*` as packages from the repo root.
pythonpath = .

# Every test here drives async code; opting in per test would be pure noise.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error::DeprecationWarning:src.*

addopts = -q
