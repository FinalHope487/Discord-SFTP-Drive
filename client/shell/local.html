<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Discord Drive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #161826;
        --surface: #232532;
        --text: #e9e9ed;
        --muted: #9397ab;
        --dim: #75798c;
        --accent: #9184d9;
        --ok: #6fbf8b;
        --warn: #e0a93b;
        --bad: #e5484d;
        --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 26px 28px 30px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        /* See setup.html: revealed once the strings are in, so the window does
           not paint one language and then the other. */
        visibility: hidden;
      }
      body.ready { visibility: visible; }
      h1 { font-size: 17px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; }
      p { margin: 0 0 10px; color: var(--muted); }
      code { font-family: var(--mono); color: var(--accent); word-break: break-all; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 18px 0 5px; }
      input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        background: var(--bg);
        border: 1px solid #3f424d;
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        font-family: var(--mono);
      }
      input:focus { border-color: var(--accent); outline: none; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        height: 32px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid #3f424d;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { background: #ffffff10; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #14121f;
        font-weight: 500;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .topbar { display: flex; justify-content: flex-end; margin-bottom: 2px; }
      button.lang {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
        color: var(--muted);
        border-color: #33363f;
      }
      button.lang:hover:not(:disabled) { color: var(--text); }
      .status {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #3f424d;
        background: var(--surface);
        font-size: 12px;
        display: none;
      }
      .status.on { display: block; }
      .status.ok { border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
      .status.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
      .status.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
      .status b { display: block; font-weight: 500; margin-bottom: 3px; }
      .status.ok b { color: var(--ok); }
      .status.bad b { color: var(--bad); }
      .status.warn b { color: var(--warn); }
      .status pre {
        margin: 6px 0 0;
        padding: 8px;
        background: var(--bg);
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 11px;
        white-space: pre-wrap;
        color: var(--muted);
        max-height: 140px;
        overflow: auto;
      }
      .note {
        margin-top: 22px;
        padding: 13px 14px;
        border-radius: 8px;
        background: var(--surface);
        font-size: 12px;
        color: var(--muted);
      }
      .note h2 { font-size: 12px; font-weight: 500; color: var(--text); margin: 0 0 6px; }
      .note pre {
        margin: 8px 0 0;
        font-family: var(--mono);
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--accent);
      }
      .back {
        display: inline-block;
        margin-top: 22px;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
      }
      .back:hover { color: var(--text); }
      .center { text-align: center; padding: 30px 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="topbar">
      <button id="lang" class="lang" type="button"></button>
    </div>

    <div id="loading" class="center" data-i18n="loading"></div>

    <div id="missing" style="display:none">
      <h1 data-i18n="missingTitle"></h1>
      <p data-i18n="missingBody"></p>
      <div class="note">
        <span data-i18n="missingHow"></span>
        <pre>./venv/Scripts/python.exe -m PyInstaller discord-drive.spec --noconfirm --distpath dist-standalone --workpath build-standalone</pre>
      </div>
    </div>

    <div id="first-run" style="display:none">
      <h1 data-i18n="firstRunTitle"></h1>
      <p data-i18n="firstRunBody"></p>
      <div class="note">
        <h2 data-i18n="configWhere"></h2>
        <code id="config-path"></code>
      </div>
      <div class="note">
        <h2 data-i18n="whatToFill"></h2>
        <div data-i18n="whatToFillBody"></div>
      </div>
      <div class="row">
        <button id="open-folder" type="button" data-i18n="openFolder"></button>
        <button id="recheck-firstrun" class="primary" type="button" data-i18n="recheck"></button>
      </div>
    </div>

    <div id="password-screen" style="display:none">
      <h1 data-i18n="passwordTitle"></h1>
      <p data-i18n="passwordBody"></p>

      <label for="password" data-i18n="passwordLabel"></label>
      <input id="password" type="password" autocomplete="off" spellcheck="false" />

      <div class="row">
        <button id="submit" class="primary" type="button" data-i18n="start"></button>
      </div>

      <div id="pw-status" class="status"></div>
    </div>

    <a id="back-link" class="back" href="setup.html" data-i18n="toRemote"></a>

    <script>
      // Its own dictionary, for the reason setup.html gives: the CSP on this
      // window allows inline script and nothing else, so neither page can load
      // a shared file. They share no sentence, so nothing is duplicated but
      // the twenty lines of machinery below.
      const STRINGS = {
        zh: {
          docTitle: "Discord Drive — 在這台電腦上執行",
          loading: "檢查中…",

          missingTitle: "找不到後端執行檔",
          missingBody:
            "這個 app 內建的後端不見了，這通常代表你是從原始碼直接跑外殼、還沒建過 `discord-drive.exe`。",
          missingHow: "在 repo 根目錄跑：",

          firstRunTitle: "第一次執行：先填設定",
          firstRunBody: "已經幫你寫了一份設定範本，還沒有 Discord 憑證這類必要資訊。",
          configWhere: "設定檔位置",
          whatToFill: "要填什麼",
          whatToFillBody:
            "打開上面那個檔案，填入標示 `REQUIRED` 的幾項——Discord bot token、" +
            "要存到哪（DM 或頻道其中一項）、還有你想用的帳號名。" +
            "`README.md` 的「Step 1 — the Discord side」有完整步驟（英文）。" +
            "填完存檔，回來按「重新檢查」。",
          openFolder: "開啟資料夾",
          recheck: "重新檢查",

          passwordTitle: "輸入密碼",
          passwordBody:
            "這組密碼包著所有檔案的加密金鑰，不會被存在硬碟上——每次啟動都要輸入一次。",
          passwordLabel: "密碼",
          start: "啟動",
          starting: "啟動中…",

          startingTitle: "正在啟動…",
          startingBody: "第一次啟動要驗證 Discord 憑證，可能要幾秒鐘。",
          backendFailedTitle: "後端無法啟動",
          backendFailedBody: "以下是它結束前的輸出：",
          timeoutTitle: "啟動逾時",
          timeoutBody:
            "後端還在跑，但沒有在時限內回應。可能是防毒軟體正在掃描，或是網路很慢。",
          failedTitle: "啟動失敗",
          failedBody: "密碼錯誤、或是設定檔裡的 Discord 憑證有問題，看下面的訊息。",

          toRemote: "← 改連遠端伺服器",
        },

        en: {
          docTitle: "Discord Drive — Run on this computer",
          loading: "Checking…",

          missingTitle: "The backend executable is missing",
          missingBody:
            "The backend this app bundles is not there. That usually means the shell is being run " +
            "straight from source and `discord-drive.exe` has never been built.",
          missingHow: "Run this in the repo root:",

          firstRunTitle: "First run: fill in the settings",
          firstRunBody:
            "A settings template has been written for you. It is still missing the values it " +
            "cannot guess, starting with your Discord credentials.",
          configWhere: "Where the settings file is",
          whatToFill: "What to fill in",
          // Both languages point here, not at GUIDE.md. GUIDE.md is
          // gitignored -- it never reaches a fresh clone, let alone this
          // packaged app's `files` list -- so it cannot be the answer for
          // either reader. There is no tracked Chinese walkthrough right now;
          // the zh string above says so and sends the reader to this same
          // section, English and all.
          whatToFillBody:
            "Open that file and fill in the values marked `REQUIRED` — your Discord bot token, " +
            "where the chunks are stored (a DM or a channel, one or the other), and the account " +
            "name you want to use. `README.md` walks through it under “Step 1 — the Discord " +
            "side”. Save the file, come back here, and press “Check again”.",
          openFolder: "Open folder",
          recheck: "Check again",

          passwordTitle: "Enter your password",
          passwordBody:
            "This password wraps the encryption key for every file. It is never written to disk, " +
            "which is why it has to be typed at every start.",
          passwordLabel: "Password",
          start: "Start",
          starting: "Starting…",

          startingTitle: "Starting…",
          startingBody:
            "The first start checks the Discord credentials, which can take a few seconds.",
          backendFailedTitle: "The backend could not start",
          backendFailedBody: "This is what it printed before it exited:",
          timeoutTitle: "Start timed out",
          timeoutBody:
            "The backend is still running but did not answer in time. Antivirus software may be " +
            "scanning it, or the network may be slow.",
          failedTitle: "Start failed",
          failedBody:
            "Either the password is wrong, or the Discord credentials in the settings file are. " +
            "The output below says which.",

          toRemote: "← Connect to a server instead",
        },
      };

      const HTML_LANG = { zh: "zh-Hant", en: "en" };

      const $ = (id) => document.getElementById(id);
      const screens = ["loading", "missing", "first-run", "password-screen"];

      let lang = "zh";
      // Held as keys so that switching language re-renders whatever the status
      // box is currently saying. The backend's own output is not a key: it is
      // the child process's stderr, which has no translation and should not
      // acquire one -- it is the text to search for or paste into an issue.
      let shown = null;

      function t(key, vars) {
        const table = STRINGS[lang] || STRINGS.zh;
        const template = table[key] ?? STRINGS.zh[key] ?? key;
        if (!vars) return template;
        return template.replace(/\{(\w+)\}/g, (whole, name) =>
          Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : whole,
        );
      }

      /** `text` with `code` and *bold* turned into elements, never into HTML. */
      function parts(text) {
        const out = [];
        const pattern = /`([^`]+)`|\*([^*]+)\*/g;
        let at = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
          if (match.index > at) out.push(document.createTextNode(text.slice(at, match.index)));
          const element = document.createElement(match[1] !== undefined ? "code" : "strong");
          element.textContent = match[1] !== undefined ? match[1] : match[2];
          out.push(element);
          at = pattern.lastIndex;
        }
        if (at < text.length) out.push(document.createTextNode(text.slice(at)));
        return out;
      }

      function fill(element, text) {
        element.replaceChildren(...parts(text));
      }

      function show(id) {
        for (const s of screens) $(s).style.display = s === id ? "block" : "none";
      }

      function renderStatus() {
        const el = $("pw-status");
        if (!shown) return;
        el.className = `status on ${shown.kind}`;
        const b = document.createElement("b");
        b.textContent = t(shown.title);
        const span = document.createElement("span");
        fill(span, t(shown.body));
        el.replaceChildren(b, span);
        if (shown.output) {
          const pre = document.createElement("pre");
          pre.textContent = shown.output;
          el.append(pre);
        }
      }

      function reportStatus(kind, title, body, output) {
        shown = { kind, title, body, output };
        renderStatus();
      }

      function applyLanguage() {
        document.documentElement.lang = HTML_LANG[lang];
        document.title = t("docTitle");
        for (const element of document.querySelectorAll("[data-i18n]")) {
          fill(element, t(element.dataset.i18n));
        }
        // See setup.html: the accessible name repeats the visible label
        // rather than replacing it.
        $("lang").textContent = lang === "zh" ? "中文" : "EN";
        $("lang").setAttribute("aria-label", lang === "zh" ? "語言：中文" : "Language: EN");
        renderStatus();
      }

      async function withBusy(button, labelKey, work) {
        const key = button.dataset.i18n;
        button.disabled = true;
        fill(button, t(labelKey));
        try {
          return await work();
        } finally {
          button.disabled = false;
          // From the dictionary, not from the label that was there: the
          // language can change while the backend is starting.
          fill(button, t(key));
        }
      }

      async function refresh(force) {
        show("loading");
        const result = await window.ddLocal.status(force);

        if (result.state === "missing") {
          show("missing");
          return;
        }
        if (result.state === "first-run") {
          $("config-path").textContent = result.configPath;
          show("first-run");
          return;
        }
        if (result.state === "awaiting-password") {
          show("password-screen");
          $("password").focus();
          return;
        }
        // "error": the backend exited before settling into either state above
        // (a crash, or a config problem check() alone would not catch). Show
        // it the same way a failed start does, with a way back to first-run.
        show("password-screen");
        reportStatus(
          "bad",
          "backendFailedTitle",
          "backendFailedBody",
          result.output || "(no output)",
        );
      }

      $("lang").addEventListener("click", async () => {
        lang = await window.dd.setLanguage(lang === "zh" ? "en" : "zh");
        applyLanguage();
      });

      $("open-folder").addEventListener("click", () => window.ddLocal.openDataFolder());
      $("recheck-firstrun").addEventListener("click", () => refresh(true));

      $("submit").addEventListener("click", () =>
        withBusy($("submit"), "starting", async () => {
          const password = $("password").value;
          if (!password) return;
          reportStatus("warn", "startingTitle", "startingBody");
          const result = await window.ddLocal.start(password);
          if (result.ok) {
            // The main process swaps this window's content for the drive
            // itself; nothing further to do here.
            return;
          }
          const timedOut = result.reason === "timeout";
          reportStatus(
            "bad",
            timedOut ? "timeoutTitle" : "failedTitle",
            timedOut ? "timeoutBody" : "failedBody",
            result.output,
          );
          $("password").value = "";
          $("password").focus();
          // The child that failed is gone; a fresh one has to be spawned
          // before another password can be sent to it.
          await window.ddLocal.status(true);
        }),
      );

      $("password").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("submit").click();
      });

      (async () => {
        try {
          // Both bridges are on this window: `dd` carries the preference the
          // other page writes, `ddLocal` carries the backend.
          lang = await window.dd.language();
          applyLanguage();
        } finally {
          document.body.classList.add("ready");
        }
        await refresh(false);
      })();
    </script>
  </body>
</html>
