# Reads .env from this directory. `docker compose up` refuses to start if any
# of the `:?` variables below is missing, which is deliberate: the server also
# validates its configuration at startup and exits 1, and with a restart policy
# that would be an invisible crash loop rather than an error you can read.
# Failing here means one clear message on the terminal instead.

services:
  mongodb:
    image: mongo:6.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-discorddrive}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    # No `ports:` on purpose. This used to publish 27017 on the host with no
    # authentication at all -- an open database holding every file's metadata
    # and chunk locations. Only sftp-discord-server needs it, and that reaches
    # it over the compose network. To inspect it by hand, prefer:
    #   docker compose exec mongodb mongosh -u <user> -p
    healthcheck:
      # Without this the app can win the startup race, fail its Mongo ping,
      # and burn restart attempts on a database that was simply still booting.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # EXACTLY ONE REPLICA. Do not `--scale` this service, do not run a second
  # copy against the same MongoDB, and do not overlap two of them during a
  # deploy.
  #
  # Handles coordinate through `_node_versions` in src/vfs.py, a dict living
  # in the process. A handle consults it before every read and write to find
  # out whether another handle has committed a change underneath it, and a
  # node it has never heard of means "nobody has touched this" -- which is
  # true within one process and false the moment there are two. Replica A
  # would keep serving a stale chunk layout for files replica B had already
  # rewritten: no error, no log line, just old bytes. That is the exact bug
  # fixed on 2026-07-31, put back.
  #
  # Supporting more than one replica needs optimistic locking at the node
  # level, not a bigger cache. See ROADMAP.md.
  sftp-discord-server:
    build: .
    ports:
      - "${SFTP_PORT:-2222}:2222"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN in .env}
      # One of these two is required; the server validates that at startup,
      # since which one you use is a choice, not an omission.
      - DISCORD_USER_ID=${DISCORD_USER_ID:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-discorddrive}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      - MONGO_DB_NAME=${MONGO_DB_NAME:-discord_sftp_vfs}
      - SFTP_USER=${SFTP_USER:?set SFTP_USER in .env}
      # Also wraps the encryption key; there is no AES_SECRET_KEY any more.
      - SFTP_PASSWORD=${SFTP_PASSWORD:?set SFTP_PASSWORD in .env}
      # Only needed while changing the password, and only read at startup.
      - SFTP_PASSWORD_OLD=${SFTP_PASSWORD_OLD:-}
      # Key derivation. Only the costs belonging to the selected KDF are used,
      # and every stored key record carries the ones it was made with, so
      # changing these never strands an existing key.
      - KDF=${KDF:-argon2id}
      - ARGON2_TIME_COST=${ARGON2_TIME_COST:-3}
      - ARGON2_MEMORY_KIB=${ARGON2_MEMORY_KIB:-65536}
      - ARGON2_PARALLELISM=${ARGON2_PARALLELISM:-1}
      - PBKDF2_ITERATIONS=${PBKDF2_ITERATIONS:-600000}
      # Opt-in, one restart at a time; see .env.example.
      - KDF_UPGRADE=${KDF_UPGRADE:-0}
      # Documented as tunable in .env.example, and it was not: the image only
      # COPYs src/, so there is no .env inside the container for
      # load_dotenv() to find, and anything missing from this list silently
      # stays at its code default. Lowering it had no effect and said
      # nothing -- the worst shape a configuration error can take.
      - DISCORD_MAX_CONCURRENCY=${DISCORD_MAX_CONCURRENCY:-4}
      # The container always listens on 2222; the host-side port is mapped
      # above, so changing SFTP_PORT does not need a rebuild.
      - SFTP_PORT=2222
      # On a volume, not the container filesystem. Without this the key is
      # regenerated on every `docker compose up --build` and every client
      # reports a host key mismatch -- which is indistinguishable from the
      # warning a real man-in-the-middle would produce.
      - SFTP_HOST_KEY_PATH=/app/keys/host_key
    volumes:
      - host_key_data:/app/keys
    depends_on:
      mongodb:
        condition: service_healthy
    # Bounded, unlike `always`. A configuration the server rejects is not
    # something retrying will fix, so it stops and leaves the validation error
    # as the last line of `docker compose logs`. Transient faults still get
    # five attempts.
    restart: on-failure:5
    # Longer than the server's own 20s drain, or the container would be killed
    # part way through flushing what clients had written but not yet filled a
    # chunk with. Docker's default here is 10s, which is shorter than the
    # drain and would have made it pointless.
    stop_grace_period: 30s

volumes:
  mongo_data:
  host_key_data:
